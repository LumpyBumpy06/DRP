# Local block storage for the voice feature.
# Brings up a MinIO (S3-compatible) server you can point the backend at by
# setting STORAGE_TARGET=local (the default) in backend/.env.
#
#   docker compose up -d minio
#
# S3 API:     http://localhost:9008   (container port 9000)
# Web console: http://localhost:9009  (login with the root user/password below)
services:
  minio:
    image: minio/minio:latest
    container_name: quietsignal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9008:9000" # S3 API  (external 9008 -> internal 9000)
      - "9009:9001" # Web console
    volumes:
      - minio-data:/data

volumes:
  minio-data:
